[package]
name = "brigd"
version = "0.1.0"
edition = "2021"
description = "Plan a staged flow of Claude agents and run each one in its own PTY"
license = "MIT"
authors = ["Mark Verma"]
repository = "https://github.com/markvrma/brigd"
homepage = "https://github.com/markvrma/brigd"
readme = "README.md"
keywords = ["tui", "claude", "agents", "pty", "terminal"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
include = ["src/**/*", "skills/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
crossterm = "0.29"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-term = "0.3"
vt100 = "0.16"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
