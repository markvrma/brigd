name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Key binding, CLI flag, flow JSON field, or behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to send a PR for this
